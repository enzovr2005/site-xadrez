<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clube de Xadrez UFV — Rating</title>
<style>
:root{--roxo:#3c254f;--roxo-2:#513466;--bege:#f0eada;--bege-2:#3c254f;--texto:#2b2032;--muted:#746b78;--borda:#d9cfae;--alta:#397354;--baixa:#a34b43;--dourado:#c99a2e;--dourado-claro:#e0bb55}
*{box-sizing:border-box} body{margin:0;background:var(--roxo);color:var(--texto);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:28px 18px 50px}
.top{background:var(--roxo);color:var(--bege);border:1px solid var(--dourado);box-shadow:0 8px 28px rgba(0,0,0,.22);border-radius:18px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;gap:18px;overflow:hidden}
.club-logo{width:82px;height:82px;object-fit:cover;border-radius:50%;flex:0 0 auto;border:2px solid var(--dourado);box-shadow:0 0 0 4px rgba(201,154,46,.14)}
.top-copy{min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;opacity:.8;font-weight:700}
h1{margin:5px 0 4px;font-family:Georgia,serif;font-size:32px;line-height:1.1} .subtitle{margin:0;color:var(--bege);opacity:.82}
.badge{margin-top:15px;border:1px solid var(--dourado);display:inline-block;background:var(--bege);color:var(--roxo);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
.section{margin-top:30px;position:relative}.section:before{content:"";display:block;width:52px;height:3px;background:var(--dourado);border-radius:3px;margin-bottom:12px} .section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 12px;flex-wrap:wrap}
.section-head h2{margin:0;color:var(--bege);font-family:Georgia,serif;font-size:26px} .section-head p{margin:3px 0 0;color:var(--bege);opacity:.72;font-size:14px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
input,select{padding:12px 14px;border:1px solid var(--borda);border-radius:10px;font-size:16px;background:var(--bege);color:var(--texto)} input{flex:1;min-width:220px} select{min-width:190px}
.history-btn{padding:12px 16px;border:1px solid var(--dourado);border-radius:10px;background:var(--roxo);color:var(--bege);font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap}
.history-btn:hover{background:var(--roxo-2);border-color:var(--dourado-claro)} .history-btn.active{background:var(--bege);color:var(--roxo)}
.history-panel{display:none;margin:0 0 16px;padding:15px;background:var(--bege);border:1px solid var(--borda);border-radius:14px}
.history-panel.open{display:block} .history-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.history-label{font-size:13px;font-weight:800;color:var(--roxo)}
.table-wrap{background:var(--bege);border:1px solid var(--dourado);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:560px} th,td{padding:13px 14px;border-bottom:1px solid var(--borda);text-align:right;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#ebe2d1;position:sticky;top:0}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left} tbody tr:hover{background:#f7f0e4}
.rank{font-weight:850;color:var(--roxo)} .name{font-weight:700}.name-link{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;width:100%;gap:0}.title{color:var(--dourado);font-weight:900;margin-right:0;letter-spacing:.02em;display:inline-block;width:44px;min-width:44px;text-align:left}.name-text{display:inline-block;min-width:0;text-align:left}.name-link:hover{color:var(--dourado);text-decoration:underline}
.change.up{color:var(--alta);font-weight:800} .change.down{color:var(--baixa);font-weight:800} .change.zero{color:var(--muted);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)} .note{margin:10px 2px 0;color:var(--bege);opacity:.65;font-size:12px}
.detail{display:none} .detail.open{display:block} .main-view.hidden{display:none}
.back{border:0;background:none;color:var(--bege);font-weight:800;font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:18px}
.detail-card{background:var(--bege);border:1px solid var(--dourado);border-radius:16px;padding:24px}
.detail-title{font-family:Georgia,serif;color:var(--roxo);text-shadow:0 1px 0 rgba(201,154,46,.18);font-size:30px;margin:0 0 5px}
.detail-sub{color:var(--muted);margin:0 0 22px} .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:#ebe2d1;border-top:3px solid var(--dourado);border-radius:12px;padding:16px} .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.stat-value{font-size:24px;font-weight:900;color:var(--dourado);margin-top:6px} .stat-small{font-size:13px;color:var(--muted);margin-top:3px}
.chart-box{border:1px solid var(--dourado);border-radius:14px;padding:18px;background:#f7f0e4;position:relative}.chart-title{font-weight:900;color:var(--roxo);margin-bottom:10px}
svg{width:100%;height:300px;display:block}
.wdl-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:center}.wdl-pie{flex:0 0 auto;width:200px}.wdl-pie svg{width:200px;height:200px}
.wdl-legend{display:flex;flex-direction:column;gap:10px;min-width:180px;flex:1}
.wdl-item{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--texto);cursor:default;padding:4px 6px;border-radius:8px}.wdl-item:hover{background:#ebe2d1}
.wdl-swatch{width:13px;height:13px;border-radius:4px;flex:0 0 auto}.wdl-item b{margin-left:auto;color:var(--roxo)}
.pie-slice{stroke:var(--bege);stroke-width:2;cursor:pointer}.pie-slice:hover{opacity:.85}
@media(max-width:500px){.wdl-wrap{justify-content:center}.wdl-pie{width:170px}.wdl-pie svg{width:170px;height:170px}}
.axis{stroke:#cfc4b3;stroke-width:1}.grid{stroke:#ded5c7;stroke-width:1}.line{fill:none;stroke:var(--dourado);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--dourado);stroke:var(--bege);stroke-width:2;cursor:pointer}.dot:hover{stroke:var(--dourado-claro);stroke-width:4}.chart-label{font-size:11px;fill:var(--muted)}.chart-tooltip{display:none;position:absolute;z-index:5;padding:8px 10px;background:var(--roxo);color:var(--bege);border:1px solid var(--dourado);border-radius:8px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;box-shadow:0 5px 15px rgba(0,0,0,.2)}.detail-note{margin-top:10px;color:var(--muted);font-size:12px}
@media(max-width:700px){.top{align-items:flex-start}.club-logo{width:68px;height:68px}.stats{grid-template-columns:1fr} .toolbar{align-items:stretch} .history-btn,input,select{width:100%}}

.home-view{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 18px}
.home-hero{background:var(--roxo);color:var(--bege);border:1px solid var(--dourado);box-shadow:0 8px 32px rgba(0,0,0,.28);border-radius:22px;padding:48px 36px;text-align:center;max-width:560px;width:100%}
.home-logo{width:150px;height:150px;object-fit:cover;border-radius:50%;border:3px solid var(--dourado);box-shadow:0 0 0 6px rgba(201,154,46,.16);margin-bottom:22px;background:var(--bege)}
.home-eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.16em;opacity:.78;font-weight:700}
.home-title{margin:8px 0 10px;font-family:Georgia,serif;font-size:40px;line-height:1.15}
.home-subtitle{margin:0 auto 26px;max-width:460px;color:var(--bege);opacity:.82;font-size:16px;line-height:1.5}
.home-badge{margin:0 0 30px;border:1px solid var(--dourado);display:inline-block;background:var(--bege);color:var(--roxo);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800}
.home-cta{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--dourado);background:var(--dourado);color:var(--roxo);font-weight:900;font-size:17px;padding:16px 30px;border-radius:14px;text-decoration:none;cursor:pointer;transition:background .15s,transform .15s}
.home-cta:hover{background:var(--dourado-claro);transform:translateY(-2px)}
.home-note{margin-top:20px;color:var(--bege);opacity:.6;font-size:13px}
.back-home{border:0;background:none;color:var(--bege);font-weight:800;font-size:13px;cursor:pointer;padding:0;opacity:.85;text-decoration:underline;margin-bottom:8px;display:inline-block}
.back-home:hover{opacity:1}
@media(max-width:520px){.home-title{font-size:32px}.home-hero{padding:36px 22px}.home-logo{width:120px;height:120px}}
</style></head>

<div id="homeView" class="home-view">
<div class="home-hero">
<img class="home-logo" id="homeLogoImg" alt="Logo do Clube de Xadrez UFV">
<div class="home-eyebrow">Clube de Xadrez</div>
<h1 class="home-title">Clube de Xadrez da UFV</h1>
<p class="home-subtitle">Torneios mensais, evolução de rating e resultados de todos os jogadores do clube em um só lugar.</p>
<div class="home-badge">Universidade Federal de Viçosa</div>
<div><button class="home-cta" id="goRankingBtn" type="button">Ver Ranking de Rating <span>→</span></button></div>
<p class="home-note">Consulte a classificação, o histórico de torneios e o perfil de cada jogador.</p>
</div>
</div>
